spring.application.name=order-service

server.port= 8082

spring.datasource.url=jdbc:mysql://localhost:3306/spring_commerce
spring.datasource.username=root
spring.datasource.password=admin
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.flyway.table=order_schema_history
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0.0.0

spring.jackson.mapper.sort-properties-alphabetically=false

order.topic=orders-topic
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.producer.properties.spring.json.type.mapping=orderEvent:com.springcomerce.orderservice.dto.OrderEvenet

