spring.application.name=notification-service

server.port=8084

spring.kafka.bootstrap-servers=192.168.176.1:9092
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.group-id=notifications-group

spring.kafka.consumer.properties.spring.json.trusted.packages=com.springcomerce.orderservice.dto

spring.kafka.consumer.properties.spring.json.type.mapping=orderEvent:com.springcomerce.notificationservice.dto.OrderEvenet

spring.kafka.consumer.auto-offset-reset=earliest

eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.client.service-url.defaultZone=http://service4:8761/eureka
